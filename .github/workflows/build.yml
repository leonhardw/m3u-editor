name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
    
env:
  APP_NAME: "M3U-Editor"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build EXE
      run: pyinstaller --onedir --windowed --add-data "disc.png;." --name "${{ env.APP_NAME }}" playlisteditor.py

    - name: Archive Release (Zip)
      run: Powershell Compress-Archive -Path "dist/${{ env.APP_NAME }}/*" -DestinationPath "${{ env.APP_NAME }}_Windows.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: "${{ env.APP_NAME }}_Windows.zip"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
